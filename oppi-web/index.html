<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#6B5BD0">
  <meta name="description" content="Oppi — Reservá servicios profesionales en Paraguay. Peluquería, hogar, handymans y más.">
  <title>Oppi — Reservá servicios en Paraguay</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='%236B5BD0'/><text x='50' y='66' font-size='52' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='bold'>o</text></svg>">
  <link rel="stylesheet" href="css/styles.css">
  <!-- Leaflet por CDN (no se inlinéa en el build de un solo archivo): mapa sin API key, tiles de OpenStreetMap -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
</head>
<body>
  <div id="app">
    <header id="topbar">
      <a href="#/" class="logo">oppi</a>
      <div class="topbar-actions">
        <a href="#/favoritos" class="icon-btn" aria-label="Favoritos">🤍</a>
        <a href="#/notificaciones" class="icon-btn bell" aria-label="Notificaciones">🔔<span id="bellCount" class="bell-count" style="display:none">0</span></a>
      </div>
    </header>

    <main id="view"><div class="empty"><div class="empty-icon">💜</div><p class="muted">Cargando Oppi…</p></div></main>

    <nav id="bottomNav" aria-label="Navegación principal"></nav>
  </div>

  <div id="demoBadge" class="demo-badge" hidden>Modo demo · sin conexión al servidor</div>

  <div id="toasts" aria-live="polite"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/data.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/router.js"></script>
  <script src="js/views-public.js"></script>
  <script src="js/views-client.js"></script>
  <script src="js/views-handyman.js"></script>
  <script src="js/views-business.js"></script>
  <script src="js/views-auth.js"></script>
  <script src="js/views-map.js"></script>
  <script src="js/views-tasks-map.js"></script>
  <script src="js/views-cancel.js"></script>
  <script src="js/views-support.js"></script>
  <script src="js/views-support-chat.js"></script>
  <script src="js/views-plus.js"></script>
  <script src="js/views-launch.js"></script>
  <script src="js/app.js"></script>

</html>
