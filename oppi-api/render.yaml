# Render.com — deploy de Oppi API en ~15 minutos.
# 1. Subí este repo a GitHub.
# 2. En Render: New → Blueprint → elegí el repo (usa este archivo).
# 3. Esperá el deploy y corré el seed una vez (ver README.md).
services:
  - type: web
    name: oppi-api
    runtime: node
    buildCommand: npm ci --omit=dev
    startCommand: node src/server.js
    healthCheckPath: /api/health
    autoDeploy: true
    disk:
      name: oppi-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      # Sin `value`: Render te pide el valor al crear el blueprint (requeridas).
      # `sync: false` = no se pisa en deploys siguientes.
      - key: JWT_SECRET
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: oppi-db
          property: connectionString
      # Email que nace admin (registro o seed). Vacío = nadie es admin.
      - key: ADMIN_EMAIL
        value: ""
      # Piloto de la nueva política de cancelación (default true).
      - key: CANCELLATION_PILOT_MODE
        value: "true"
      - key: STORAGE_DRIVER
        value: local
      - key: STORAGE_LOCAL_DIR
        value: /opt/render/project/src/data/uploads
      - key: PAYMENT_PROVIDER
        value: mock
      - key: PUSH_PROVIDER
        value: mock
      - key: JOB_DEPOSIT_PERCENT
        value: 30
      - key: REFERRAL_BONUS_GS
        value: 20000

databases:
  - name: oppi-db
    databaseName: oppi
    plan: starter
